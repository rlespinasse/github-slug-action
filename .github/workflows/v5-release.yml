name: "[v5] Release"
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}-${{ github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Release this GitHub Action
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 21
          branches: v5.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

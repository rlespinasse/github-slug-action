version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/.github/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - '*'
    labels: []
  - package-ecosystem: 'github-actions'
    directory: '/'
    commit-message:
      prefix: 'feat: '
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns:
          - 'rlespinasse/shortify-git-revision'
    labels: []
